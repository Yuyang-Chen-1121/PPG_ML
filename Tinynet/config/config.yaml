# =========================================================================
# TinyNet V2.6.1 Configuration
# =========================================================================

model_config_path: "./config/config.yaml"

train:
  batch_size: 4096        # A100
  learning_rate: 0.001   # 初始学习率
  epochs: 50            # 训练轮数
  checkpoint_dir: "./checkpoints/tinynet_v2.6.1" # 模型存档路径

hardware:
  input_alignment: 16      # 输入通道必须是16的倍数
  softmax_limit: 128       # Softmax最大支持128个输入
  max_pooling_kernel: 8    # 硬件支持的最大池化核大小
  quantization_bit: 8      # INT8 量化

data:
  input_length: 320        # 10秒 * 32Hz
  sampling_rate: 32

  # Ch0: PPG, Ch1: ACC模长, Ch4: Delta, Ch5: Env, ch2-3&ch6-15:设为0，可添加
  input_channels: 16       

model:
  name: "TinyNet_V2.6.1"
  dropout: 0.25

  backbone:
    conv1:
      out_channels: 16
      kernel_size: 7
      stride: 2
      padding: 3
    pool1:
      kernel_size: 2
      stride: 2
    
    conv2:
      out_channels: 32
      kernel_size: 5
      stride: 1
      padding: 2
    pool2:
      kernel_size: 1
      stride: 1
      
    conv3:
      out_channels: 64
      kernel_size: 3
      stride: 1
      padding: 1
    pool3:
      kernel_size: 2
      stride: 2
      
    conv4:
      out_channels: 64
      kernel_size: 3
      stride: 1
      padding: 1
    pool4:
      type: "avg"          # 最后使用平均池化
      kernel_size: 4       # < 8 (硬件限制)
      stride: 4

  # 房颤检测头 (Head A)
  af_head:
    output_dim: 16         # 硬件对齐：输出16路，取前2路有效
    num_classes: 2         # NSR vs AF

  # 心率估计头 (Head B)
  hr_head:
    output_dim: 128        # 硬件限制：Softmax 128
    min_bpm: 30
    max_bpm: 210