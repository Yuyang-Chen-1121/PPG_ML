experiment_name: ppg_fusion_v1
dataset:
  name: PPG-DaLiA
  dalia_raw_dir: data/raw/dalia
  dalia_processed_dir: data/processed/dalia
  fs: 64
  window_size: 512
  stride: 256
  train_val_test_split:
    train: 0.7
    val: 0.15
    test: 0.15
  batch_size: 64
  num_workers: 4
preprocessing:
  stft:
    n_fft: 128
    hop_length: 32
  filter:
    low_cut: 0.5
    high_cut: 4.0
  acc_ma_window: 5
  acc_z_thresh: 2.5
  spectrogram:
    enabled: true
training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  save_dir: ./checkpoints
loss_weights:
  segmentation: 1.0
  distribution: 5.0
